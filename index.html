<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live2D 角色与服装模型总览">
  <title>Live2D 角色图鉴</title>
  <style>
    :root {
      --ink: #172033;
      --ink-soft: #334155;
      --muted: #64748b;
      --paper: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #d9e0e7;
      --line-strong: #c4ced9;
      --teal: #0f766e;
      --teal-soft: #dff5f1;
      --blue: #2563eb;
      --blue-soft: #e7efff;
      --coral: #c2410c;
      --coral-soft: #ffeadf;
      --gold: #a16207;
      --gold-soft: #fff5cf;
      --violet: #6d28d9;
      --violet-soft: #eee8ff;
      --shadow-sm: 0 2px 8px rgba(23, 32, 51, 0.06);
      --shadow-md: 0 16px 34px rgba(23, 32, 51, 0.1);
      --radius: 8px;
      --font-mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.38);
      outline-offset: 3px;
    }

    .catalog-header {
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .header-top,
    .header-content,
    .catalog-content,
    .catalog-footer {
      width: min(1400px, 100%);
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 32px 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: color 180ms ease;
    }

    .back-link:hover {
      color: var(--blue);
    }

    .back-link-mark {
      display: inline-grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
    }

    .header-kicker {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .header-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 48px;
      padding: 42px 32px 40px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      max-width: 700px;
      color: var(--ink);
      font-size: clamp(32px, 4vw, 52px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.08;
    }

    .header-description {
      max-width: 620px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(94px, 1fr));
      min-width: 226px;
      border-top: 1px solid var(--line-strong);
      border-left: 1px solid var(--line-strong);
      background: var(--panel);
    }

    .summary-item {
      min-height: 84px;
      padding: 14px 16px;
      border-right: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
    }

    .summary-item strong,
    .summary-item span {
      display: block;
    }

    .summary-item strong {
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.15;
    }

    .summary-item span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .catalog-content {
      padding: 32px 32px 52px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .section-heading h2 {
      color: var(--ink);
      font-size: 20px;
      font-weight: 800;
    }

    .section-heading p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .runtime-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      background: var(--panel);
      box-shadow: var(--shadow-sm);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot,
    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--gold);
    }

    .runtime-status.is-ready .status-dot {
      background: var(--teal);
    }

    .runtime-status.is-error .status-dot {
      background: var(--coral);
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .character-card {
      --card-accent: var(--teal);
      --card-soft: var(--teal-soft);
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow-sm);
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .character-card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      content: "";
      background: var(--card-accent);
      z-index: 2;
    }

    .character-card:hover {
      border-color: var(--card-accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .tone-cyan {
      --card-accent: var(--teal);
      --card-soft: var(--teal-soft);
    }

    .tone-blue {
      --card-accent: var(--blue);
      --card-soft: var(--blue-soft);
    }

    .tone-coral {
      --card-accent: var(--coral);
      --card-soft: var(--coral-soft);
    }

    .tone-gold {
      --card-accent: var(--gold);
      --card-soft: var(--gold-soft);
    }

    .tone-violet {
      --card-accent: var(--violet);
      --card-soft: var(--violet-soft);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-height: 76px;
      padding: 18px 16px 12px;
    }

    .character-kicker {
      color: var(--card-accent);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-head h3 {
      margin-top: 3px;
      overflow: hidden;
      color: var(--ink);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 5px 7px;
      border-radius: 5px;
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .card-status.is-loaded {
      color: var(--teal);
      background: var(--card-soft);
    }

    .card-status.is-error {
      color: var(--coral);
      background: var(--coral-soft);
    }

    .model-viewport {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      min-height: 260px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background-color: #f2f5f7;
      background-image:
        linear-gradient(rgba(100, 116, 139, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 116, 139, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .model-viewport::after {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(100, 116, 139, 0.12);
      content: "";
      pointer-events: none;
      z-index: 1;
    }

    .model-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .model-canvas {
      z-index: 2;
      cursor: pointer;
    }

    .model-loading {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(196, 206, 217, 0.9);
      border-radius: 5px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow-sm);
      font-size: 11px;
      font-weight: 700;
      transform: translate(-50%, -50%);
      transition: opacity 180ms ease;
    }

    .model-loading.is-error {
      border-color: rgba(194, 65, 12, 0.28);
      color: var(--coral);
    }

    .model-loading.is-error .loading-spinner {
      display: none;
    }

    .model-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(15, 118, 110, 0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 750ms linear infinite;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 11px 16px 13px;
    }

    .model-path {
      overflow: hidden;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      color: var(--card-accent);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .live-label .live-dot {
      background: var(--card-accent);
    }

    .catalog-footer {
      padding: 0 32px 30px;
      color: var(--muted);
      font-size: 12px;
    }

    .noscript-note {
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      color: var(--ink-soft);
      background: var(--panel);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 1120px) {
      .character-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .header-content {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .summary-grid {
        width: min(100%, 460px);
      }

      .character-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .header-top,
      .header-content,
      .catalog-content,
      .catalog-footer {
        padding-left: 18px;
        padding-right: 18px;
      }

      .header-top {
        padding-top: 14px;
      }

      .header-content {
        gap: 22px;
        padding-top: 30px;
        padding-bottom: 28px;
      }

      h1 {
        font-size: 35px;
      }

      .header-description {
        font-size: 15px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .character-grid {
        grid-template-columns: 1fr;
      }

      .model-viewport {
        min-height: 330px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="catalog-header">
    <div class="header-top">
      <div class="back-link" aria-label="Live2D 角色图鉴">
        <span class="back-link-mark" aria-hidden="true">L2</span>
        <span>Live2D 角色图鉴</span>
      </div>
      <span class="header-kicker">LIVE2D CATALOG</span>
    </div>
    <div class="header-content">
      <div>
        <p class="eyebrow">角色资源总览</p>
        <h1>Live2D 角色图鉴</h1>
        <p class="header-description">当前仓库内可加载的 Live2D 角色与服装变体，全部使用实时模型渲染。</p>
      </div>
      <div class="summary-grid" aria-label="角色数量统计">
        <div class="summary-item">
          <strong id="characterCount">5</strong>
          <span>角色</span>
        </div>
        <div class="summary-item">
          <strong id="modelCount">11</strong>
          <span>模型变体</span>
        </div>
        <div class="summary-item">
          <strong>6</strong>
          <span>Pio 服装</span>
        </div>
        <div class="summary-item">
          <strong id="loadedCount">0</strong>
          <span>已加载</span>
        </div>
      </div>
    </div>
  </header>

  <main class="catalog-content">
    <section aria-labelledby="galleryTitle">
      <div class="section-heading">
        <div>
          <h2 id="galleryTitle">全部模型</h2>
          <p>每个变体独立占位，窗口尺寸变化时自动重新适配。</p>
        </div>
        <div class="runtime-status" id="runtimeStatus" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="runtimeStatusText">准备加载</span>
        </div>
      </div>
      <div class="character-grid" id="characterGrid" role="list" aria-label="Live2D 角色列表"></div>
      <noscript>
        <div class="noscript-note">当前浏览器未启用 JavaScript，无法加载 Live2D 模型。</div>
      </noscript>
    </section>
  </main>

  <footer class="catalog-footer">Live2D 角色图鉴 · 静态资源目录</footer>

  <script>
    (function () {
      "use strict";

      var ASSET_BASE = "./vendor/mascot/";
      var RUNTIME_BASE = "./vendor/live2d-runtime/";
      var CATALOG = [
        {
          characterId: "pio",
          characterName: "Pio（原版）",
          variant: "校服",
          model: "pio/school/model.json",
          pathLabel: "pio / school",
          tone: "cyan",
          offsetY: 0
        },
        {
          characterId: "pio",
          characterName: "Pio（原版）",
          variant: "连衣裙",
          model: "pio/dress/model.json",
          pathLabel: "pio / dress",
          tone: "cyan",
          offsetY: 0
        },
        {
          characterId: "pio",
          characterName: "Pio（原版）",
          variant: "运动服",
          model: "pio/sport/model.json",
          pathLabel: "pio / sport",
          tone: "cyan",
          offsetY: 0
        },
        {
          characterId: "pio",
          characterName: "Pio（原版）",
          variant: "泳装",
          model: "pio/bikini/model.json",
          pathLabel: "pio / bikini",
          tone: "cyan",
          offsetY: 0
        },
        {
          characterId: "pio",
          characterName: "Pio（原版）",
          variant: "浴巾",
          model: "pio/bath/model.json",
          pathLabel: "pio / bath",
          tone: "cyan",
          offsetY: 0
        },
        {
          characterId: "pio",
          characterName: "Pio（原版）",
          variant: "黄裙",
          model: "pio/yellow/model.json",
          pathLabel: "pio / yellow",
          tone: "cyan",
          offsetY: 0
        },
        {
          characterId: "haru",
          characterName: "春（Haru）",
          variant: "版本 1",
          model: "haru/01/haru01.model.json",
          pathLabel: "haru / 01",
          tone: "coral",
          offsetY: 28
        },
        {
          characterId: "haru",
          characterName: "春（Haru）",
          variant: "版本 2",
          model: "haru/02/haru02.model.json",
          pathLabel: "haru / 02",
          tone: "coral",
          offsetY: 28
        },
        {
          characterId: "shizuku",
          characterName: "雫（Shizuku）",
          variant: "默认",
          model: "shizuku/shizuku.model.json",
          pathLabel: "shizuku / default",
          tone: "blue",
          offsetY: 0
        },
        {
          characterId: "hibiki",
          characterName: "响（Hibiki）",
          variant: "默认",
          model: "hibiki/hibiki.model.json",
          pathLabel: "hibiki / default",
          tone: "gold",
          offsetY: 0
        },
        {
          characterId: "hijiki",
          characterName: "ひじき（Hijiki）",
          variant: "默认",
          model: "hijiki/hijiki.model.json",
          pathLabel: "hijiki / default",
          tone: "violet",
          offsetY: 0
        }
      ];

      var grid = document.getElementById("characterGrid");
      var runtimeStatus = document.getElementById("runtimeStatus");
      var runtimeStatusText = document.getElementById("runtimeStatusText");
      var loadedCount = document.getElementById("loadedCount");
      var records = [];
      var loadedScripts = {};
      var loadedModels = 0;

      function updateRuntimeStatus(text, kind) {
        runtimeStatusText.textContent = text;
        runtimeStatus.classList.remove("is-ready", "is-error");
        if (kind) runtimeStatus.classList.add(kind);
      }

      function setText(parent, className, text) {
        var element = document.createElement("span");
        element.className = className;
        element.textContent = text;
        parent.appendChild(element);
        return element;
      }

      function createCard(entry) {
        var card = document.createElement("article");
        card.className = "character-card tone-" + entry.tone;
        card.setAttribute("role", "listitem");

        var head = document.createElement("div");
        head.className = "card-head";
        var titleWrap = document.createElement("div");
        titleWrap.className = "title-wrap";
        setText(titleWrap, "character-kicker", entry.characterName);
        var title = document.createElement("h3");
        title.textContent = entry.variant;
        titleWrap.appendChild(title);
        var status = document.createElement("span");
        status.className = "card-status";
        setText(status, "status-dot", "");
        status.lastChild.setAttribute("aria-hidden", "true");
        setText(status, "card-status-text", "等待 Live2D");
        head.appendChild(titleWrap);
        head.appendChild(status);

        var viewport = document.createElement("div");
        viewport.className = "model-viewport";
        var canvas = document.createElement("canvas");
        canvas.className = "model-canvas";
        canvas.setAttribute("aria-label", entry.characterName + " " + entry.variant + " Live2D 角色");
        var loading = document.createElement("div");
        loading.className = "model-loading";
        var spinner = document.createElement("span");
        spinner.className = "loading-spinner";
        spinner.setAttribute("aria-hidden", "true");
        loading.appendChild(spinner);
        setText(loading, "loading-text", "载入模型");
        viewport.appendChild(canvas);
        viewport.appendChild(loading);

        var footer = document.createElement("div");
        footer.className = "card-footer";
        setText(footer, "model-path", entry.pathLabel);
        var liveLabel = document.createElement("span");
        liveLabel.className = "live-label";
        setText(liveLabel, "live-dot", "").setAttribute("aria-hidden", "true");
        setText(liveLabel, "", "LIVE2D");
        footer.appendChild(liveLabel);

        card.appendChild(head);
        card.appendChild(viewport);
        card.appendChild(footer);
        grid.appendChild(card);

        return {
          entry: entry,
          card: card,
          canvas: canvas,
          loading: loading,
          status: status,
          statusText: status.querySelector(".card-status-text"),
          viewport: viewport,
          app: null,
          model: null
        };
      }

      function setCardStatus(record, text, kind) {
        record.statusText.textContent = text;
        record.status.classList.remove("is-loaded", "is-error");
        if (kind) record.status.classList.add(kind);
      }

      function showModelError(record, text) {
        var loadingText = record.loading.querySelector(".loading-text");
        if (loadingText) loadingText.textContent = text || "Live2D 加载失败";
        record.loading.classList.remove("is-hidden");
        record.loading.classList.add("is-error");
        setCardStatus(record, "加载失败", "is-error");
      }

      function loadScript(src) {
        if (loadedScripts[src]) return loadedScripts[src];
        loadedScripts[src] = new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.onload = function () { resolve(src); };
          script.onerror = function () {
            delete loadedScripts[src];
            reject(new Error("脚本加载失败: " + src));
          };
          document.head.appendChild(script);
        });
        return loadedScripts[src];
      }

      function loadRuntime() {
        return loadScript(RUNTIME_BASE + "pixi.min.js")
          .then(function () { return loadScript(RUNTIME_BASE + "live2d.min.js"); })
          .then(function () {
            if (!window.Live2DCubismCore) window.Live2DCubismCore = {};
            return loadScript(RUNTIME_BASE + "pixi-live2d-display.min.js");
          })
          .then(function () {
            if (!(window.PIXI && window.PIXI.live2d && window.PIXI.live2d.Live2DModel)) {
              throw new Error("Live2D 运行时未就绪");
            }
          });
      }

      function configureTextures(model) {
        try {
          var textures = model.internalModel && model.internalModel.textures;
          if (!textures || !textures.length || !window.PIXI) return;
          var mipmapMode = window.PIXI.MIPMAP_MODES
            ? window.PIXI.MIPMAP_MODES.POW2
            : true;
          textures.forEach(function (texture) {
            var baseTexture = texture.baseTexture || texture;
            if (!baseTexture) return;
            baseTexture.mipmap = mipmapMode;
            if (typeof baseTexture.update === "function") baseTexture.update();
          });
        } catch (err) {
          console.warn("[live-characters] 纹理优化失败：", err);
        }
      }

      function fitModel(record) {
        if (!record.app || !record.model) return;
        var rect = record.viewport.getBoundingClientRect();
        var width = Math.max(220, Math.floor(rect.width));
        var height = Math.max(260, Math.floor(rect.height));
        record.app.renderer.resize(width, height);

        var internal = record.model.internalModel;
        var modelW = (internal && internal.originalWidth) ||
          (record.model.width / (record.model.scale.x || 1)) || width;
        var modelH = (internal && internal.originalHeight) ||
          (record.model.height / (record.model.scale.y || 1)) || height;
        var fitScale = Math.min(width / modelW, height / modelH) * 0.88;
        if (!isFinite(fitScale) || fitScale <= 0) return;

        record.model.scale.set(fitScale);
        if (record.model.anchor) record.model.anchor.set(0.5, 0.5);
        record.model.x = width * 0.5;
        record.model.y = height * 0.5 + (record.entry.offsetY || 0);
      }

      function playTapMotion(record) {
        if (!record.model) return;
        try {
          if (typeof record.model.motion === "function") {
            record.model.motion("tap_body");
          } else if (record.model.internalModel && record.model.internalModel.motionManager &&
            typeof record.model.internalModel.motionManager.startMotion === "function") {
            record.model.internalModel.motionManager.startMotion("tap_body");
          }
        } catch (err) {
          console.warn("[live-characters] 动作播放失败：", err);
        }
      }

      function bindModel(record) {
        if (!record.model || typeof record.model.on !== "function") return;
        record.model.on("hit", function () {
          playTapMotion(record);
        });
      }

      function createApplication(record) {
        var rect = record.viewport.getBoundingClientRect();
        var dpr = Math.max(1, window.devicePixelRatio || 1);
        return new window.PIXI.Application({
          view: record.canvas,
          width: Math.max(220, Math.floor(rect.width)),
          height: Math.max(260, Math.floor(rect.height)),
          resolution: dpr,
          autoDensity: true,
          transparent: true,
          autoStart: true,
          antialias: true,
          powerPreference: "high-performance"
        });
      }

      function loadRecord(record) {
        var app;
        try {
          app = createApplication(record);
          record.app = app;
        } catch (err) {
          showModelError(record, "Live2D 画布创建失败");
          return Promise.resolve(false);
        }

        return window.PIXI.live2d.Live2DModel.from(ASSET_BASE + record.entry.model).then(function (model) {
          record.model = model;
          app.stage.addChild(model);
          configureTextures(model);
          fitModel(record);
          bindModel(record);
          record.loading.classList.add("is-hidden");
          setCardStatus(record, "已加载", "is-loaded");
          return true;
        }).catch(function (err) {
          console.warn("[live-characters] 模型加载失败：" + record.entry.model, err);
          if (app && typeof app.destroy === "function") {
            try { app.destroy(true, { children: true }); } catch (destroyErr) {}
          }
          record.app = null;
          showModelError(record, "Live2D 加载失败");
          return false;
        });
      }

      function loadAllRecords() {
        var nextIndex = 0;
        var completed = 0;
        var workers = Math.min(3, records.length);

        function worker() {
          if (nextIndex >= records.length) return Promise.resolve();
          var record = records[nextIndex];
          nextIndex += 1;
          return loadRecord(record).then(function (loaded) {
            completed += 1;
            if (loaded) loadedModels += 1;
            loadedCount.textContent = String(loadedModels);
            updateRuntimeStatus("正在加载 " + completed + " / " + records.length);
            return worker();
          });
        }

        var jobs = [];
        for (var i = 0; i < workers; i += 1) jobs.push(worker());
        return Promise.all(jobs);
      }

      var resizePending = false;
      function resizeAll() {
        if (resizePending) return;
        resizePending = true;
        window.requestAnimationFrame(function () {
          resizePending = false;
          records.forEach(fitModel);
        });
      }

      function applyVisibilityState() {
        records.forEach(function (record) {
          if (!record.app || !record.app.ticker) return;
          if (document.hidden) {
            record.app.ticker.stop();
          } else {
            record.app.ticker.start();
          }
        });
      }

      function init() {
        var uniqueCharacters = {};
        CATALOG.forEach(function (entry) {
          uniqueCharacters[entry.characterId] = true;
          records.push(createCard(entry));
        });
        document.getElementById("characterCount").textContent = String(Object.keys(uniqueCharacters).length);
        document.getElementById("modelCount").textContent = String(CATALOG.length);

        updateRuntimeStatus("正在准备运行时");
        loadRuntime()
          .then(function () {
            updateRuntimeStatus("正在加载 0 / " + records.length);
            return loadAllRecords();
          })
          .then(function () {
            if (loadedModels === records.length) {
              updateRuntimeStatus("全部 Live2D 已加载", "ready");
            } else {
              updateRuntimeStatus(loadedModels + " / " + records.length + " 个 Live2D 已加载", "error");
            }
          })
          .catch(function (err) {
            console.warn("[live-characters] 运行时初始化失败：", err);
            records.forEach(function (record) { showModelError(record, "Live2D 运行时不可用"); });
            updateRuntimeStatus("Live2D 运行时不可用", "error");
          });
      }

      window.addEventListener("resize", resizeAll, { passive: true });
      document.addEventListener("visibilitychange", applyVisibilityState);
      init();
    })();
  </script>
</body>
</html>
